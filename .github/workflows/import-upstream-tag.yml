name: Preserve upstream version tag
on:
  push:
    paths:
      - ".github/workflows/import-upstream-tag.yml"
permissions:
  contents: write
jobs:
  tag:
    if: github.repository == 'dczhhh/quant-strategies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Preserve version used by hatch-vcs
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ml4t/backtest.git
          git fetch upstream tag v0.1.12
          git merge-base --is-ancestor v0.1.12 HEAD
          git diff --exit-code v0.1.12 HEAD -- .github/workflows/ci.yml .github/workflows/compatibility.yml .github/workflows/docs.yml .github/workflows/ecosystem.yml .github/workflows/private-comparisons.yml .github/workflows/release.yml .github/workflows/security.yml
          git push origin refs/tags/v0.1.12:refs/tags/v0.1.12
